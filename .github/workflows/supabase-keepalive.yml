# Hält die kostenlosen Supabase-Projekte wach.
# Supabase pausiert Free-Projekte nach 7 Tagen ohne Anfragen.
# Dieser Job fragt alle 2 Tage je eine öffentliche Tabelle/Funktion ab.
# Die Schlüssel hier sind die öffentlichen "publishable" Schlüssel (stehen ohnehin in den Apps).
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: AzubiHub (azubi-app)
        run: |
          curl -fsS -o /dev/null -w "AzubiHub: %{http_code}\n" \
            -X POST "https://brtdtjqinyhsesiqhkkk.supabase.co/rest/v1/rpc/demo_content" \
            -H "apikey: sb_publishable_i5Lf1DJYMBVX0yQOW2_nKQ_bRBbDUD2" \
            -H "Content-Type: application/json" -d '{}'
      - name: GuestFlow (hotel-restaurant-app)
        run: |
          curl -fsS -o /dev/null -w "GuestFlow: %{http_code}\n" \
            "https://zohdlnsznsmoedsnamcn.supabase.co/rest/v1/hotels?select=id&limit=1" \
            -H "apikey: sb_publishable_W_sGM_YG_dtJMybvUqt0aw_F9GzmvS7"
